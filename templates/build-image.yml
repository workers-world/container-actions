# 复制到镜像仓 .github/workflows/build-image.yml
# 仅 master 推 GHCR（+ schedule / workflow_dispatch）
name: Build and Push Image

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  build-push:
    permissions:
      contents: read
      packages: write
    uses: workers-world/container-actions/.github/workflows/container-build-push.yml@actions/v0.1.1
    secrets:
      DISPATCH_TOKEN: ${{ secrets.GHA_TOKEN }}
    with:
      image: ghcr.io/workers-world/REPLACE_IMAGE
      emit_dispatch: true
      dispatch_type: REPLACE_IMAGE_pushed
      dispatch_repos: workers-world/REPLACE_ACCESS_LAYER
